<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="6" stdDeviation="4" flood-color="rgba(0,0,0,0.45)"/>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#1a6bcc"/>

  <!-- Brain line art with drop shadow, clipped to circle -->
  <g clip-path="url(#circle-clip)" filter="url(#shadow)">
    <!-- Brain outline - left hemisphere -->
    <path d="
      M 100 68
      C 100 68 88 62 78 65
      C 66 68 58 78 58 90
      C 58 98 62 104 68 108
      C 64 112 62 118 64 124
      C 66 132 74 136 82 134
      C 84 138 88 140 92 140
      L 100 140
    "
    fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Brain outline - right hemisphere -->
    <path d="
      M 100 68
      C 100 68 112 62 122 65
      C 134 68 142 78 142 90
      C 142 98 138 104 132 108
      C 136 112 138 118 136 124
      C 134 132 126 136 118 134
      C 116 138 112 140 108 140
      L 100 140
    "
    fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Centre divide -->
    <line x1="100" y1="68" x2="100" y2="140" stroke="white" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>

    <!-- Left hemisphere folds -->
    <path d="M 72 82 C 76 78 82 78 84 84" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 66 96 C 70 90 78 90 80 96" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 70 110 C 74 104 82 104 84 110" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 76 124 C 80 118 88 118 90 124" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right hemisphere folds -->
    <path d="M 128 82 C 124 78 118 78 116 84" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 134 96 C 130 90 122 90 120 96" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 130 110 C 126 104 118 104 116 110" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 124 124 C 120 118 112 118 110 124" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Circle border -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
</svg>
